---
# DESTRUCTIVE. Tears the cluster down to prepped-but-unbootstrapped nodes:
# kubeadm reset, CNI state, and the kube-vip manifest. It deliberately does not
# touch the Longhorn volume — that is where the data is, and a teardown that
# silently destroys data is a footgun, not a convenience. Wipe it by hand if
# that is really what you want.
- name: Confirm before destroying the cluster
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Require an explicit opt-in
      ansible.builtin.assert:
        that:
          - confirm_reset | default('') == 'yes'
        fail_msg: >-
          Refusing to reset. This destroys the cluster on every node in the
          inventory. Re-run with -e confirm_reset=yes if that is what you want.

- name: Reset every node
  hosts: all
  gather_facts: true
  tasks:
    # kube-vip goes first, and gets a chance to exit. kubeadm reset empties the
    # manifests directory and kills the pod via the CRI, which never lets
    # kube-vip release the VIP — the address then survives on this node's
    # interface, and the next bootstrap's joins dial it and reach a node with
    # no API server. The explicit delete below covers the case where it still
    # did not let go.
    - name: Remove the kube-vip static pod manifest
      ansible.builtin.file:
        path: /etc/kubernetes/manifests/kube-vip.yaml
        state: absent
      register: kube_vip_manifest

    - name: Give the kubelet time to stop kube-vip  # noqa: no-handler — must run here, before reset, not at play end
      ansible.builtin.pause:
        seconds: 15
      when: kube_vip_manifest is changed

    - name: Make sure the VIP is gone from this node
      ansible.builtin.command:
        cmd: "ip addr del {{ control_plane_vip }}/32 dev {{ item }}"
      loop: "{{ ansible_interfaces | difference(['lo']) }}"
      register: vip_del
      changed_when: vip_del.rc == 0
      failed_when: false
      when: inventory_hostname in groups['control_plane']

    # Cilium mounts cgroup2 under /run/cilium and kubeadm reset does not unmount
    # it; removing the directory with the mount still there fails EBUSY.
    - name: Unmount Cilium's cgroup2 mount if present
      ansible.posix.mount:
        path: /run/cilium/cgroupv2
        state: unmounted

    # A silent failure here is the worst outcome: the survey play on the next
    # bootstrap sees kubelet.conf, marks the node as already joined, and never
    # joins it. So this is allowed to fail, and the result is checked below.
    - name: Run kubeadm reset
      ansible.builtin.command:
        cmd: kubeadm reset --force
      register: kubeadm_reset
      changed_when: kubeadm_reset.rc == 0

    - name: Confirm the node's cluster identity is gone
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf_after

    - name: Fail if kubeadm reset left the node joined
      ansible.builtin.assert:
        that:
          - not kubelet_conf_after.stat.exists
        fail_msg: >-
          /etc/kubernetes/kubelet.conf still exists on {{ inventory_hostname }}
          after kubeadm reset. The next bootstrap would treat this node as
          already joined and skip it. Check for busy mounts under
          /var/lib/kubelet.

    # kubeadm reset leaves CNI state behind, and a stale one breaks the next
    # bootstrap in ways that look like a CNI bug rather than leftovers.
    - name: Remove CNI configuration and state
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/cni
        - /run/cilium

    - name: Drop the operator's kubeconfig
      ansible.builtin.file:
        path: /root/.kube/config
        state: absent

    - name: Report what was left alone
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} reset. {{ longhorn_mount }} was NOT touched —
          remove it by hand if the data should go too.
