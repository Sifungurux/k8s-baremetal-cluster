---
# Ingress, not Gateway API — ingress-nginx dropped its Gateway API work, and
# that role belongs to Envoy Gateway here. This exists so repos still shipping
# Ingress resources (k8s-sigstore) keep working unchanged.
controller:
  replicaCount: 2
  service:
    # MetalLB hands this an address. Without MetalLB it would sit Pending
    # forever.
    #
    # WHICH address is not set here: the Makefile passes
    # controller.service.annotations."metallb.io/loadBalancerIPs" from
    # ingress_nginx_lb_ip in group_vars, so every address this rack uses stays
    # described in one file. The address must sit inside metallb_named_pool,
    # whose autoAssign is off — that is what keeps MetalLB from handing it to
    # something else while this Service is absent.
    type: LoadBalancer
  ingressClassResource:
    # The default only applies to Ingress resources; it says nothing about
    # Gateway API, which routes by gatewayClassName instead.
    default: true
