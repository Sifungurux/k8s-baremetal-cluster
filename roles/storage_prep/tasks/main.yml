---
- name: Create the Longhorn logical volume
  community.general.lvol:
    vg: "{{ longhorn_vg }}"
    lv: "{{ longhorn_lv }}"
    size: "{{ longhorn_lv_size }}"
    state: present
    shrink: false  # refuse to lvreduce on a config downsize — that truncates a live ext4 fs
    resizefs: true  # grow ext4 to match when longhorn_lv_size is increased
  tags:
    - hostonly

- name: Create an ext4 filesystem on it
  community.general.filesystem:
    fstype: ext4
    dev: "/dev/{{ longhorn_vg }}/{{ longhorn_lv }}"
  tags:
    - hostonly

- name: Ensure the mount point exists
  ansible.builtin.file:
    path: "{{ longhorn_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount the Longhorn volume and persist it in fstab
  ansible.posix.mount:
    path: "{{ longhorn_mount }}"
    src: "/dev/{{ longhorn_vg }}/{{ longhorn_lv }}"
    fstype: ext4
    opts: defaults
    state: mounted
  tags:
    - hostonly
