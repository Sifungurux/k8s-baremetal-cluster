---
driver:
  name: docker

platforms:
  - name: debian12
    image: geerlingguy/docker-debian12-ansible@sha256:3232ce7d506146b149802b561f49871dde8339fa6cb0e175c69db69530cedd47  # yamllint disable-line rule:line-length
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_SKIP_TAGS: hostcheck
  inventory:
    group_vars:
      all:
        # Baseline valid values shared by both negative cases in converge.yml.
        # Test fixtures only — not the real rack. pod_cidr and metallb_pool
        # are deliberately NOT set here; each case overrides them with a
        # value that violates one specific constraint.
        kubernetes_version: "1.33"
        kubernetes_patch_version: "1.33.4"
        containerd_version: "1.7.24"
        pause_image_version: "3.10"
        control_plane_vip: "10.20.0.5"
        rack_subnet: "10.20.0.0/24"
        service_cidr: "10.96.0.0/12"
        longhorn_vg: "vg_test"

verifier:
  name: ansible
