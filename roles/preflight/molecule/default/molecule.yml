---
driver:
  name: docker

platforms:
  - name: debian12
    image: geerlingguy/docker-debian12-ansible@sha256:3232ce7d506146b149802b561f49871dde8339fa6cb0e175c69db69530cedd47  # yamllint disable-line rule:line-length
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
    ANSIBLE_SKIP_TAGS: hostcheck
  inventory:
    group_vars:
      all:
        # Test fixtures only — not the real rack. Coherent, obviously-fake
        # values chosen so the CIDR non-overlap assertion is genuinely
        # exercised against the plan's real pod/service CIDRs.
        kubernetes_version: "1.33"
        control_plane_vip: "10.20.0.5"
        metallb_pool: "10.20.0.200-10.20.0.250"
        rack_subnet: "10.20.0.0/24"
        pod_cidr: "10.244.0.0/16"
        service_cidr: "10.96.0.0/12"
        longhorn_vg: "vg_test"

verifier:
  name: ansible
