---
- name: Required variables are defined
  ansible.builtin.assert:
    that:
      - kubernetes_version is defined and kubernetes_version != "CHANGEME"
      - control_plane_vip is defined and control_plane_vip != "CHANGEME"
      - metallb_pool is defined and metallb_pool != "CHANGEME"
      - metallb_named_pool is defined and metallb_named_pool != "CHANGEME"
      - rack_subnet is defined and rack_subnet != "CHANGEME"
      - longhorn_vg is defined and longhorn_vg != "CHANGEME"
      - longhorn_lv_size is defined and longhorn_lv_size != "CHANGEME"
      - containerd_version is defined and containerd_version != "CHANGEME"
      - kubernetes_patch_version is defined and kubernetes_patch_version != "CHANGEME"
      - pause_image_version is defined and pause_image_version != "CHANGEME"
    fail_msg: "Fill in inventory/group_vars/all.yml before running anything"
  run_once: true
  delegate_to: localhost
  become: false

- name: Pod and service CIDRs do not collide with the rack subnet
  ansible.builtin.assert:
    that:
      - not (rack_subnet | ansible.utils.network_in_network(pod_cidr))
      - not (pod_cidr | ansible.utils.network_in_network(rack_subnet))
      - not (rack_subnet | ansible.utils.network_in_network(service_cidr))
      - not (service_cidr | ansible.utils.network_in_network(rack_subnet))
    fail_msg: "pod_cidr/service_cidr overlap rack_subnet — pick non-overlapping ranges"
  run_once: true
  delegate_to: localhost
  become: false

- name: Parse the MetalLB pool endpoints
  ansible.builtin.set_fact:
    metallb_pool_start: "{{ metallb_pool.split('-')[0] }}"
    metallb_pool_end: "{{ metallb_pool.split('-')[1] }}"
    metallb_named_start: "{{ metallb_named_pool.split('-')[0] }}"
    metallb_named_end: "{{ metallb_named_pool.split('-')[1] }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: Control-plane VIP falls inside the rack subnet
  ansible.builtin.assert:
    that:
      - rack_subnet | ansible.utils.network_in_network(control_plane_vip)
    fail_msg: "control_plane_vip and rack_subnet collide — control_plane_vip must be an address on rack_subnet"
  run_once: true
  delegate_to: localhost
  become: false

- name: Control-plane VIP does not collide with the MetalLB pool
  ansible.builtin.assert:
    that:
      - >-
        not (
          (control_plane_vip | ansible.utils.ipaddr('int') | int >= metallb_pool_start | ansible.utils.ipaddr('int') | int)
          and
          (control_plane_vip | ansible.utils.ipaddr('int') | int <= metallb_pool_end | ansible.utils.ipaddr('int') | int)
        )
    fail_msg: "control_plane_vip and metallb_pool collide — control_plane_vip falls inside the MetalLB pool range"
  run_once: true
  delegate_to: localhost
  become: false

- name: MetalLB pool falls inside the rack subnet
  ansible.builtin.assert:
    that:
      - rack_subnet | ansible.utils.network_in_network(metallb_pool_start)
      - rack_subnet | ansible.utils.network_in_network(metallb_pool_end)
    fail_msg: "metallb_pool and rack_subnet collide — metallb_pool must sit entirely inside rack_subnet"
  run_once: true
  delegate_to: localhost
  become: false

- name: MetalLB pool does not collide with the pod CIDR
  ansible.builtin.assert:
    that:
      - not (pod_cidr | ansible.utils.network_in_network(metallb_pool_start))
      - not (pod_cidr | ansible.utils.network_in_network(metallb_pool_end))
    fail_msg: "metallb_pool and pod_cidr collide — pick a MetalLB pool outside pod_cidr"
  run_once: true
  delegate_to: localhost
  become: false

- name: MetalLB pool does not collide with the service CIDR
  ansible.builtin.assert:
    that:
      - not (service_cidr | ansible.utils.network_in_network(metallb_pool_start))
      - not (service_cidr | ansible.utils.network_in_network(metallb_pool_end))
    fail_msg: "metallb_pool and service_cidr collide — pick a MetalLB pool outside service_cidr"
  run_once: true
  delegate_to: localhost
  become: false

# The reserved pool gets the same treatment as the automatic one — it is a
# range of real addresses on the same VLAN, and being reserved protects it from
# MetalLB, not from a typo.
- name: Reserved MetalLB pool falls inside the rack subnet
  ansible.builtin.assert:
    that:
      - rack_subnet | ansible.utils.network_in_network(metallb_named_start)
      - rack_subnet | ansible.utils.network_in_network(metallb_named_end)
    fail_msg: "metallb_named_pool and rack_subnet collide — metallb_named_pool must sit entirely inside rack_subnet"
  run_once: true
  delegate_to: localhost
  become: false

- name: Reserved MetalLB pool does not collide with the pod or service CIDR
  ansible.builtin.assert:
    that:
      - not (pod_cidr | ansible.utils.network_in_network(metallb_named_start))
      - not (pod_cidr | ansible.utils.network_in_network(metallb_named_end))
      - not (service_cidr | ansible.utils.network_in_network(metallb_named_start))
      - not (service_cidr | ansible.utils.network_in_network(metallb_named_end))
    fail_msg: "metallb_named_pool and pod_cidr/service_cidr collide — pick a reserved pool outside both"
  run_once: true
  delegate_to: localhost
  become: false

- name: Control-plane VIP does not collide with the reserved MetalLB pool
  ansible.builtin.assert:
    that:
      - (control_plane_vip | ansible.utils.ipaddr('int')) < (metallb_named_start | ansible.utils.ipaddr('int'))
        or (control_plane_vip | ansible.utils.ipaddr('int')) > (metallb_named_end | ansible.utils.ipaddr('int'))
    fail_msg: "control_plane_vip and metallb_named_pool collide — the VIP falls inside the reserved range"
  run_once: true
  delegate_to: localhost
  become: false

# Two pools that overlap are rejected by MetalLB's own admission webhook, but
# only at apply time — which on this repo's path means halfway through
# make metallb, after the chart has already upgraded. Catch it here instead.
- name: The two MetalLB pools do not overlap each other
  ansible.builtin.assert:
    that:
      - (metallb_named_end | ansible.utils.ipaddr('int')) < (metallb_pool_start | ansible.utils.ipaddr('int'))
        or (metallb_pool_end | ansible.utils.ipaddr('int')) < (metallb_named_start | ansible.utils.ipaddr('int'))
    fail_msg: "metallb_pool and metallb_named_pool overlap — MetalLB rejects overlapping pools"
  run_once: true
  delegate_to: localhost
  become: false

- name: Check whether the cluster is already bootstrapped
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: admin_conf
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  tags:
    - hostcheck

- name: Control-plane VIP must be free (pre-bootstrap)
  ansible.builtin.command:
    cmd: "ping -c1 -W1 {{ control_plane_vip }}"
  register: vip_ping
  failed_when: vip_ping.rc == 0
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  become: false
  when: not admin_conf.stat.exists
  tags:
    - hostcheck

- name: Control-plane VIP must answer (post-bootstrap)
  ansible.builtin.command:
    cmd: "ping -c1 -W1 {{ control_plane_vip }}"
  register: vip_ping_up
  failed_when: vip_ping_up.rc != 0
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['control_plane'][0] }}"
  become: false
  when: admin_conf.stat.exists
  tags:
    - hostcheck

- name: Volume group has free space for the Longhorn LV
  ansible.builtin.command:
    cmd: "vgs --noheadings -o vg_free --units g {{ longhorn_vg }}"
  register: vg_free
  changed_when: false
  tags:
    - hostcheck

- name: Fail if the volume group is full
  ansible.builtin.assert:
    that:
      - vg_free.stdout | trim | regex_replace('g$', '') | float > 0
    fail_msg: "No free space in VG {{ longhorn_vg }} on {{ inventory_hostname }}"
  tags:
    - hostcheck

- name: Node has an address on the rack subnet
  ansible.builtin.assert:
    that:
      - ansible_all_ipv4_addresses | ansible.utils.ipaddr(rack_subnet)
        | difference([control_plane_vip]) | length == 1
    fail_msg: >-
      {{ inventory_hostname }} must hold exactly one address on rack_subnet
      ({{ rack_subnet }}), excluding the control-plane VIP. It has
      {{ ansible_all_ipv4_addresses | ansible.utils.ipaddr(rack_subnet)
         | difference([control_plane_vip]) | length }}. node_ip cannot be
      resolved unambiguously.
  tags:
    - hostcheck

- name: Time is synchronised
  ansible.builtin.command:
    cmd: timedatectl show -p NTPSynchronized --value
  register: ntp_sync
  changed_when: false
  failed_when: ntp_sync.stdout | trim != "yes"
  tags:
    - hostcheck
