---
- name: reload sysctl
  ansible.builtin.command: sysctl --system
  failed_when: false

- name: restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true
  failed_when: false

- name: restart kubelet
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
    daemon_reload: true
  failed_when: false
