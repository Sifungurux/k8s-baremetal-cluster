---
- name: Disable swap for the current boot
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) > 0
  changed_when: ansible_swaptotal_mb | default(0) > 0
  tags:
    - hostonly

- name: Comment out swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]*\sswap\s.*)$'
    replace: '# \1'

- name: Load required kernel modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    owner: root
    group: root
    mode: "0644"

- name: Load modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  failed_when: false          # no-ops in containers; real hosts load them
  tags:
    - hostonly

- name: Set kubernetes sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    owner: root
    group: root
    mode: "0644"
  notify: reload sysctl

- name: Install containerd
  ansible.builtin.apt:
    name: "containerd={{ containerd_version }}*"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - hostonly

- name: Hold containerd at the pinned version
  ansible.builtin.dpkg_selections:
    name: containerd
    selection: hold
  tags:
    - hostonly

- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write containerd config with the systemd cgroup driver
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: restart containerd
